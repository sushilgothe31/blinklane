services:
  - type: web
    name: blinklane-api
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MERCHANT_WALLET_ADDRESS
        sync: false
      - key: PAYMENT_LAMPORTS
        value: "20000000"
      - key: SOLANA_RPC_URL
        value: https://api.mainnet-beta.solana.com
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
