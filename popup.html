<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px; padding: 20px; margin: 0; background: #07080d; color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .title { font-size: 14px; font-weight: 700; letter-spacing: 0.5px; color: #9945FF; }
    .badge { font-size: 10px; background: rgba(20, 241, 149, 0.15); color: #14F195; padding: 2px 6px; border-radius: 4px; font-weight: 600; }
    .card { background: #0f111a; border: 1px solid #1c1e2e; border-radius: 10px; padding: 12px; margin-bottom: 14px; }
    .label { font-size: 11px; color: #8a8d9f; margin-bottom: 4px; }
    .value { font-size: 13px; font-weight: 600; color: #fff; font-family: monospace; }
    .footer { font-size: 11px; color: #5c5f73; text-align: center; border-top: 1px solid #141622; padding-top: 10px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">BLINKLANE PROTOCOL</div>
    <div class="badge">ACTIVE</div>
  </div>
  <div class="card">
    <div class="label">Bridge Pipeline Context</div>
    <div class="value">Solana Web3 ➔ Web2 Database</div>
  </div>
  <div class="card">
    <div class="label">Token Targets Tracked</div>
    <div class="value">USDT, USDC, SOL</div>
  </div>
  <div class="footer">Monitoring operational viewports securely.</div>
</body>
</html>
